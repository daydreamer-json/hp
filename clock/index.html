<!DOCTYPE html>
<html lang="ja" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Clock</title>
    <style>
      @import url('https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css');
      @import url('https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11/font/bootstrap-icons.min.css');
      @import url('https://rsms.me/inter/inter.css');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Noto+Sans+JP:wght@100..900&family=Noto+Sans+SC:wght@100..900&display=swap');
      @import url('https://iosevka-webfonts.github.io/iosevka/Iosevka.css');
      @import url('../assets/fonts/dseg/dseg.css');
      @import url('./assets/css/main.css');
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/js/bootstrap.min.js"></script>
  </head>
  <body>
    <!-- Settings Button -->
    <button id="settings-btn" class="settings-btn">
      <i class="bi bi-gear"></i>
    </button>
    <!-- PiP Button -->
    <button id="pip-btn" class="settings-btn">
      <i class="bi bi-pip"></i>
    </button>

    <!-- Options Menu -->
    <div id="options-menu" class="options-menu">
      <div class="menu-content">
        <h6 class="menu-title">設定</h6>
        <div class="menu-item">
          <label class="menu-label">
            <input type="checkbox" id="millisec-toggle" class="menu-checkbox" />
            1/100秒表示
          </label>
        </div>
        <div class="menu-item">
          <label class="menu-label">
            <input type="checkbox" id="glow-pulse-toggle" class="menu-checkbox" />
            1秒ごとに発光する
          </label>
        </div>
      </div>
    </div>

    <div class="container-fluid h-100">
      <div class="row h-100">
        <div class="col-12 d-flex align-items-center justify-content-center">
          <div class="clock fst-italic" id="clock">--:--:--:--</div>
        </div>
      </div>
    </div>
    <script type="module" src="./assets/js/main.js"></script>
  </body>
</html>
